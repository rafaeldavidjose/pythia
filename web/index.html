<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pythia</title>
<style>
/* Layout: top bar, student list on the left, student page on the right */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2430; --muted: #5d6878;
  --line: #dde1e8; --accent: #2f5bd3; --accent-bg: #e8eefc;
  --ok: #1d7a46; --ok-bg: #e3f4ea; --warn: #9a6200; --warn-bg: #fdf1d8;
  --bad: #b3261e; --bad-bg: #fbe6e4; --code: #f2f4f7;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --text: #e4e8ee; --muted: #9aa4b2;
    --line: #2e343e; --accent: #7d9cf0; --accent-bg: #25304a;
    --ok: #6bcf94; --ok-bg: #1d3327; --warn: #e8b75c; --warn-bg: #3a2f19;
    --bad: #f08a82; --bad-bg: #3d2220; --code: #161a20;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 14px/1.45 var(--font);
  display: flex; flex-direction: column;
}
button, select, input, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 12px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select, input[type=text], input[type=number], textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 8px;
}
textarea { width: 100%; resize: vertical; }
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
nav { display: flex; gap: 4px; }
nav button { border: none; background: none; padding: 6px 10px; color: var(--muted); }
nav button.active { color: var(--text); background: var(--accent-bg); }
.grow { flex: 1; }
main, .view { flex: 1; min-height: 0; display: flex; }
.left {
  width: 46%; min-width: 380px; display: flex; flex-direction: column;
  border-right: 1px solid var(--line); min-height: 0;
}
.right { flex: 1; min-width: 0; overflow: auto; padding: 20px 24px; }
.bar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.bar input[type=text] { flex: 1; min-width: 220px; }
.drop {
  border: 1.5px dashed var(--line); border-radius: 8px; padding: 10px 14px;
  color: var(--muted); text-align: center; margin: 12px 16px 0;
}
.drop.over { border-color: var(--accent); background: var(--accent-bg); color: var(--text); }
.list { overflow: auto; flex: 1; min-height: 0; }
table { border-collapse: collapse; width: 100%; }
th, td {
  text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line);
  vertical-align: top;
}
th {
  font-size: 12px; color: var(--muted); font-weight: 600;
  position: sticky; top: 0; background: var(--bg);
}
.list tbody tr { cursor: pointer; }
.list tbody tr:hover, .list tbody tr.selected { background: var(--accent-bg); }
.list tbody tr.selected { box-shadow: inset 3px 0 0 var(--accent); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill {
  display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px;
  white-space: nowrap;
}
.p-ok { background: var(--ok-bg); color: var(--ok); }
.p-warn { background: var(--warn-bg); color: var(--warn); }
.p-bad { background: var(--bad-bg); color: var(--bad); }
.p-neutral { background: var(--code); color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.progress {
  height: 4px; width: 140px; background: var(--line); border-radius: 2px;
  overflow: hidden;
}
.progress div { height: 100%; width: 0; background: var(--accent); }
h2 { font-size: 20px; margin: 0 0 4px; }
h3 { font-size: 14px; margin: 0; }
.page-top {
  display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap;
  margin-bottom: 16px;
}
.big-grade { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1; }
.fields { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.criterion {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; margin-bottom: 10px;
}
.criterion.bad { border-left: 3px solid var(--bad); }
.criterion.partial { border-left: 3px solid var(--warn); }
.criterion.good { border-left: 3px solid var(--ok); }
.criterion-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.criterion input[type=number] { width: 72px; }
.tests { list-style: none; margin: 0 0 8px; padding: 0; font-size: 13px; }
.tests li { margin-bottom: 4px; }
.tests .details { margin: 3px 0 6px 22px; }
.tests .details pre { margin: 4px 0; }
.hint { color: var(--muted); font-size: 13px; }
.notice, .alert { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
.notice { background: var(--warn-bg); color: var(--warn); }
.alert { background: var(--bad-bg); color: var(--bad); }
details { margin-top: 14px; }
summary { cursor: pointer; color: var(--muted); }
pre {
  background: var(--code); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px; overflow: auto; font: 12.5px/1.5 var(--mono); margin: 8px 0 0;
  white-space: pre;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 6px;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
.exercises { padding: 20px 24px; overflow: auto; flex: 1; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px 16px; margin-bottom: 12px; max-width: 860px;
}
.form {
  display: grid; grid-template-columns: 160px 1fr; gap: 10px 14px;
  align-items: center; max-width: 860px;
}
label.check { display: inline-flex; gap: 6px; align-items: center; }
@media (max-width: 900px) {
  .view { flex-direction: column; }
  .left {
    width: auto; min-width: 0; max-height: 45vh; border-right: none;
    border-bottom: 1px solid var(--line);
  }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Pythia</h1>
  <label class="muted">Exercise <select id="exerciseSelect"></select></label>
  <span class="grow"></span>
  <nav>
    <button id="tabGrading" class="active">Grading</button>
    <button id="tabExercises">Exercises</button>
  </nav>
</header>
<main>
  <section class="view" id="gradingView">
    <div class="left">
      <div class="bar">
        <input type="text" id="folderInput" aria-label="Submissions folder"
               placeholder="submissions/entrega1">
        <button id="importFolderButton" class="primary">Import folder</button>
      </div>
      <div class="bar">
        <button id="pickButton">Choose folders</button>
        <button id="zipButton">Import zip</button>
        <input type="file" id="pickInput" webkitdirectory multiple hidden>
        <input type="file" id="zipInput" accept=".zip,.py" multiple hidden>
        <span class="grow"></span>
        <button id="evaluateButton" class="primary">Grade new</button>
        <button id="regradeButton"
                title="Grades every student not finalized again. Their manual changes are lost.">Regrade</button>
      </div>
      <div class="drop" id="dropZone">Drop student folders, their parent folder or the Moodle zip here</div>
      <div class="bar" style="border-bottom:none;background:none;padding-bottom:6px">
        <span id="countLabel" class="muted small"></span>
        <div class="progress" id="progressBar" hidden><div></div></div>
        <span class="grow"></span>
        <button id="exportButton">Export reports</button>
      </div>
      <div class="list">
        <table>
          <thead><tr><th>No.</th><th>Name</th><th>Class</th><th>Grade</th><th>Status</th></tr></thead>
          <tbody id="studentRows"></tbody>
        </table>
        <div id="noStudents" class="empty" hidden>No submissions yet. Import the student folders to start.</div>
      </div>
    </div>
    <div class="right" id="studentPage"><div class="empty">Pick a student from the list.</div></div>
  </section>

  <section class="view" id="exercisesView" hidden>
    <div class="exercises">
      <div id="exerciseCards"></div>
      <div class="card">
        <h3 style="margin-bottom:12px">Add or update an exercise</h3>
        <div class="form">
          <label for="newId">Name</label>
          <input type="text" id="newId" placeholder="Exercise_2">
          <label for="newSolution">Solution (solution.py, optional)</label>
          <input type="file" id="newSolution" accept=".py">
          <label for="newRules">Rules (rules.json)</label>
          <input type="file" id="newRules" accept=".json">
          <span></span>
          <div>
            <button id="saveExerciseButton" class="primary">Save exercise</button>
            <span class="muted small">If the exercise exists, the chosen files replace the old ones.</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = selector => document.querySelector(selector);
const SUBMISSIONS_BASE = "submissions/entrega";

let exercises = [];
let currentExercise = null;
let students = [];
let currentStudent = null;
let pageData = null;
let pollTimer = null;
let unsaved = false;

function toast(message) {
  const el = $("#toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove("show"), 2600);
}

function esc(value) {
  const map = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"};
  return String(value ?? "").replace(/[&<>"]/g, c => map[c]);
}

function grade(value) {
  return value == null ? "-" : String(Math.round(value * 100) / 100);
}

function storageGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}

function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}

async function api(path, body) {
  const options = body ? {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  } : {};
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Error");
  return data;
}

function exParam() {
  return "ex=" + encodeURIComponent(currentExercise);
}

/* Exercises */

async function loadExercises(keep) {
  exercises = await api("/api/exercises");
  const select = $("#exerciseSelect");
  const previous = keep || select.value || storageGet("exercise");
  select.innerHTML = exercises.map(e =>
    `<option value="${esc(e.id)}">${esc(e.id)} · ${esc(e.title)}</option>`).join("");
  if (exercises.some(e => e.id === previous)) select.value = previous;
  currentExercise = select.value || null;
  renderExercises();
  suggestFolder();
}

function renderExercises() {
  $("#exerciseCards").innerHTML = exercises.map(e => `
    <div class="card">
      <div class="criterion-top">
        <h3>${esc(e.id)}</h3><span class="muted">${esc(e.title)}</span>
        <span class="grow"></span>
        <span class="pill p-neutral">${e.students} submissions</span>
        <span class="pill ${e.error ? "p-bad" : "p-ok"}">${e.error ? "has problems" : "ready"}</span>
      </div>
      ${e.error ? `<div class="alert">${esc(e.error)}</div>` : ""}
      <table>
        <thead><tr><th>Criterion</th><th>Points</th><th>Tests</th><th>Description</th></tr></thead>
        <tbody>
          ${e.criteria.map(c => `<tr>
            <td>${esc(c.name)}${c.review ? ' <span class="pill p-warn">review</span>' : ""}</td>
            <td class="num">${grade(c.points)}</td>
            <td class="num">${c.tests}</td>
            <td class="muted">${esc(c.description)}</td>
          </tr>`).join("")}
          <tr><td><b>Total</b></td><td class="num"><b>${grade(e.total)}</b></td><td></td><td></td></tr>
        </tbody>
      </table>
      ${e.ai_trap.length ? `<p class="muted small">AI trap: ${e.ai_trap.map(esc).join(", ")}</p>` : ""}
      <div class="actions" style="margin-bottom:0">
        <button data-show="${esc(e.id)}|solution">Show solution</button>
        <button data-show="${esc(e.id)}|rules">Show rules</button>
        <button data-validate="${esc(e.id)}"
          title="Grades solution.py with rules.json. It has to pass every test.">Check rules</button>
      </div>
      <pre hidden id="file_${esc(e.id)}"></pre>
    </div>`).join("") || '<div class="empty">No exercises yet.</div>';
}

$("#exerciseCards").addEventListener("click", async event => {
  const button = event.target.closest("[data-show], [data-validate]");
  if (!button) return;
  const id = button.dataset.validate || button.dataset.show.split("|")[0];
  const pre = document.getElementById("file_" + id);
  if (button.dataset.validate) {
    pre.textContent = "Checking...";
    pre.hidden = false;
    const result = await api(`/api/validate?ex=${encodeURIComponent(id)}`);
    pre.textContent = (result.ok ? "OK\n\n" : "Problems found\n\n") + result.messages.join("\n");
    return;
  }
  const which = button.dataset.show.split("|")[1];
  const data = await api(`/api/exercise_file?ex=${encodeURIComponent(id)}&which=${which}`);
  pre.textContent = data.text || "(empty)";
  pre.hidden = false;
});

$("#saveExerciseButton").onclick = async () => {
  const id = $("#newId").value.trim();
  if (!id) return toast("Enter the exercise name.");
  const read = input => input.files[0] ? input.files[0].text() : Promise.resolve(null);
  const [solution, rules] = await Promise.all([read($("#newSolution")), read($("#newRules"))]);
  try {
    const info = await api("/api/exercises", {id, solution, rules});
    toast(info.error ? "Saved, but: " + info.error : "Exercise saved.");
    $("#newId").value = $("#newSolution").value = $("#newRules").value = "";
    await loadExercises(info.id);
  } catch (e) {
    toast(e.message);
  }
};

/* Tabs */

function showTab(grading) {
  $("#gradingView").hidden = !grading;
  $("#exercisesView").hidden = grading;
  $("#tabGrading").classList.toggle("active", grading);
  $("#tabExercises").classList.toggle("active", !grading);
}

$("#tabGrading").onclick = () => showTab(true);
$("#tabExercises").onclick = () => { showTab(false); loadExercises(); };

$("#exerciseSelect").onchange = () => {
  if (unsaved && !confirm("This page has unsaved changes. Switch exercise anyway?")) {
    $("#exerciseSelect").value = currentExercise;
    return;
  }
  currentExercise = $("#exerciseSelect").value;
  storageSet("exercise", currentExercise);
  suggestFolder();
  currentStudent = null;
  unsaved = false;
  $("#studentPage").innerHTML = '<div class="empty">Pick a student from the list.</div>';
  loadStudents();
};

/* Student list */

function statusPill(s) {
  if (!s.evaluated) return '<span class="pill p-neutral">not graded</span>';
  if (s.finalized) return '<span class="pill p-ok">finalized</span>';
  if (s.needs_review) {
    return '<span class="pill p-warn" title="The file did not run to the end or a test timed out">review</span>';
  }
  return '<span class="pill p-neutral">graded</span>';
}

async function loadStudents() {
  if (!currentExercise) return;
  const data = await api("/api/students?" + exParam());
  students = data.students;
  $("#studentRows").innerHTML = students.map(s => `
    <tr data-id="${esc(s.id)}" class="${s.id === currentStudent ? "selected" : ""}">
      <td class="num">${esc(s.number) || '<span class="muted">?</span>'}</td>
      <td>
        ${esc(s.name)}
        ${s.recognized ? "" : '<span class="pill p-warn" title="Not found in students.csv">unknown</span>'}
        ${s.ai_trap ? '<span class="pill p-bad" title="The code contains the AI trap word. Grade unchanged.">possible AI</span>' : ""}
        <div class="muted small">${esc(s.file || "no .py file")}</div>
      </td>
      <td class="num">${esc(s.class)}</td>
      <td class="num"><b>${grade(s.grade)}</b></td>
      <td>${statusPill(s)}</td>
    </tr>`).join("");
  $("#noStudents").hidden = students.length > 0;
  const graded = students.filter(s => s.evaluated).length;
  const finalized = students.filter(s => s.finalized).length;
  $("#countLabel").textContent = students.length
    ? `${students.length} students · ${graded} graded · ${finalized} finalized` : "";
  showProgress(data.progress);
}

$("#studentRows").addEventListener("click", event => {
  const row = event.target.closest("tr[data-id]");
  if (row) openStudent(row.dataset.id);
});

function showProgress(progress) {
  const bar = $("#progressBar");
  const running = progress && progress.running;
  bar.hidden = !running;
  $("#evaluateButton").disabled = $("#regradeButton").disabled = running;
  if (running) {
    bar.firstElementChild.style.width = (progress.total ? 100 * progress.done / progress.total : 0) + "%";
    $("#countLabel").textContent = `Grading ${progress.done} of ${progress.total}...`;
    if (!pollTimer) pollTimer = setInterval(loadStudents, 1000);
  } else if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
    toast(progress && progress.error ? progress.error : "Grading finished.");
    if (currentStudent) openStudent(currentStudent, true);
  }
}

async function evaluate(body) {
  try {
    const progress = await api("/api/evaluate", {ex: currentExercise, ...body});
    if (!progress.total) return toast("No students to grade.");
    showProgress(progress);
  } catch (e) {
    toast(e.message);
  }
}

$("#evaluateButton").onclick = () => evaluate({});
$("#regradeButton").onclick = () => {
  const question = "Regrade every student not finalized? Their grades and comments go back to the automatic values.";
  if (confirm(question)) evaluate({all: true});
};

/* Import */

function importMessage(result) {
  let message = `${result.added} added, ${result.updated} updated.`;
  if (result.unrecognized.length) message += ` ${result.unrecognized.length} not found in students.csv.`;
  return message;
}

function suggestFolder() {
  const match = (currentExercise || "").match(/(\d+)\s*$/);
  const saved = storageGet("folder_" + currentExercise);
  $("#folderInput").value = saved || (match ? SUBMISSIONS_BASE + match[1] : "");
}

$("#importFolderButton").onclick = async () => {
  const folder = $("#folderInput").value.trim();
  if (!folder) return toast("Enter the submissions folder.");
  if (!currentExercise) return toast("Choose an exercise first.");
  try {
    const result = await api("/api/import_folder", {ex: currentExercise, folder});
    storageSet("folder_" + currentExercise, folder);
    toast(importMessage(result));
    await loadStudents();
  } catch (e) {
    toast(e.message);
  }
};

function toBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let text = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    text += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(text);
}

async function uploadFiles(items) {
  if (!items.length) return toast("No files found.");
  if (!currentExercise) return toast("Choose an exercise first.");
  // Other files are sent empty, only to see who handed in the wrong file
  const files = await Promise.all(items.map(async item => ({
    path: item.path,
    data: /\.(py|zip)$/i.test(item.path)
      ? toBase64(await item.file.arrayBuffer()) : "",
  })));
  try {
    toast(importMessage(await api("/api/import_files", {ex: currentExercise, files})));
    await loadStudents();
  } catch (e) {
    toast(e.message);
  }
}

$("#pickButton").onclick = () => $("#pickInput").click();
$("#zipButton").onclick = () => $("#zipInput").click();
$("#pickInput").onchange = event => {
  uploadFiles([...event.target.files].map(f => ({path: f.webkitRelativePath || f.name, file: f})));
  event.target.value = "";
};
$("#zipInput").onchange = event => {
  uploadFiles([...event.target.files].map(f => ({path: f.name, file: f})));
  event.target.value = "";
};

async function readEntry(entry, prefix, result) {
  if (entry.isFile) {
    const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
    result.push({path: prefix + entry.name, file});
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    let batch;
    do {
      batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
      for (const child of batch) await readEntry(child, prefix + entry.name + "/", result);
    } while (batch.length);
  }
}

const dropZone = $("#dropZone");
for (const type of ["dragenter", "dragover"]) {
  dropZone.addEventListener(type, e => { e.preventDefault(); dropZone.classList.add("over"); });
}
for (const type of ["dragleave", "drop"]) {
  dropZone.addEventListener(type, e => { e.preventDefault(); dropZone.classList.remove("over"); });
}
dropZone.addEventListener("drop", async event => {
  const entries = [...event.dataTransfer.items]
    .map(item => item.webkitGetAsEntry && item.webkitGetAsEntry()).filter(Boolean);
  const result = [];
  // Several dropped folders are treated as siblings under a common root
  for (const entry of entries) await readEntry(entry, entries.length > 1 ? "dropped/" : "", result);
  uploadFiles(result);
});

/* Student page */

async function openStudent(id, force) {
  if (!force && unsaved && id !== currentStudent
      && !confirm("This page has unsaved changes. Leave anyway?")) return;
  currentStudent = id;
  unsaved = false;
  document.querySelectorAll("#studentRows tr").forEach(row =>
    row.classList.toggle("selected", row.dataset.id === id));
  pageData = await api(`/api/student?${exParam()}&id=${encodeURIComponent(id)}`);
  renderStudent();
}

function criterionClass(c, value) {
  if (value >= c.points) return "good";
  return value <= 0 ? "bad" : "partial";
}

function renderFailure(failure) {
  const output = failure.expected_output === undefined ? ""
    : `<pre>Expected:\n${esc(failure.expected_output)}\n\nGot:\n${esc(failure.actual_output)}</pre>`;
  return `<div>${esc(failure.message)}</div>${output}`;
}

function renderTest(test, index) {
  const [pillClass, status] = test.ok ? ["p-ok", "passed"]
    : test.ran ? ["p-bad", "failed"] : ["p-warn", "not run"];
  const details = test.failures.map(renderFailure).join("")
    + (test.hint ? `<div class="hint">Explicação: ${esc(test.hint)}</div>` : "");
  return `<li><span class="pill ${pillClass}">${status}</span> Test ${index + 1}: ${esc(test.label)}
    ${details ? `<div class="details">${details}</div>` : ""}</li>`;
}

function renderTests(c) {
  const tests = c.tests || [];
  const hint = c.hint ? `<div class="hint">Explicação: ${esc(c.hint)}</div>` : "";
  return `<ul class="tests">${tests.map(renderTest).join("")}</ul>${hint}`;
}

function renderCriterion(c, index) {
  const value = pageData.grades[c.name] ?? c.auto;
  const testsClass = c.passed === c.total ? "p-ok" : c.passed ? "p-warn" : "p-bad";
  return `<div class="criterion ${criterionClass(c, value)}" data-index="${index}">
    <div class="criterion-top">
      <h3>${esc(c.name)}</h3>
      <span class="pill ${testsClass}">${c.passed}/${c.total} tests</span>
      ${c.review ? '<span class="pill p-warn">check manually</span>' : ""}
      <span class="grow"></span>
      <span class="muted small">automatic ${grade(c.auto)}</span>
      <label class="small"><input type="number" class="grade-input" min="0" max="${c.points}"
        step="0.25" value="${value}"> / ${grade(c.points)}</label>
    </div>
    ${renderTests(c)}
    <textarea class="comment-input" rows="1"
      placeholder="Optional comment (shown in the report, in Portuguese)">${esc(pageData.comments[c.name] || "")}</textarea>
  </div>`;
}

function renderCode(code) {
  if (!code) return "(no file)";
  return code.split("\n").map((line, i) =>
    `<span class="muted">${String(i + 1).padStart(3)}  </span>${esc(line)}`).join("\n");
}

function renderStudent() {
  const s = pageData.summary;
  const ev = pageData.evaluation;
  const total = ev ? ev.criteria.reduce((sum, c) => sum + c.points, 0) : 0;
  const index = students.findIndex(item => item.id === s.id);
  const fileField = s.files.length > 1
    ? `<label>Graded file <select id="fileSelect">${s.files.map(f =>
        `<option ${f === s.file ? "selected" : ""}>${esc(f)}</option>`).join("")}</select></label>`
    : `<span>File: ${esc(s.file || "none")}</span>`;

  let html = `
  <div class="page-top">
    <div class="grow">
      <h2>${esc(s.name)}</h2>
      <div class="fields">
        <label class="muted small">Name <input type="text" id="nameInput" value="${esc(s.name)}" size="22"></label>
        <label class="muted small">Number <input type="text" id="numberInput" value="${esc(s.number)}" size="10"></label>
        <label class="muted small">Class <input type="text" id="classInput" value="${esc(s.class)}" size="2"></label>
      </div>
      <div class="fields small muted"><span>Folder: ${esc(s.source)}</span>${fileField}</div>
    </div>
    <div style="text-align:right">
      <div class="big-grade" id="totalGrade">${grade(s.grade)}</div>
      <div class="muted small">out of ${grade(total)}</div>
      <div class="actions" style="margin:10px 0 0;justify-content:flex-end">
        <button id="previousButton" ${index <= 0 ? "disabled" : ""}>‹ Previous</button>
        <button id="nextButton" ${index < 0 || index >= students.length - 1 ? "disabled" : ""}>Next ›</button>
      </div>
    </div>
  </div>`;

  if (!ev) {
    html += `<div class="notice">This student has not been graded yet.</div>
      <div class="actions"><button class="primary" id="regradeOneButton">Grade now</button></div>`;
  } else {
    if (s.warning) html += `<div class="notice">${esc(s.warning)}</div>`;
    if (ev.ai_trap.length) {
      html += `<div class="alert"><b>Possible AI use.</b> The code contains the AI trap word from the
        assignment. This does not change the grade or the report; check with the student.<br>
        ${ev.ai_trap.map(hit => `Line ${hit.line}: <code>${esc(hit.text)}</code>`).join("<br>")}</div>`;
    }
    if (ev.load.error) html += `<div class="alert">The file did not run to the end: ${esc(ev.load.error)}</div>`;
    if (s.finalized) html += '<div class="notice">Finalized. Untick "Finalized" to grade it again.</div>';
    html += ev.criteria.map(renderCriterion).join("");
    html += `<label class="muted small" for="notesInput">General notes (shown in the report, in Portuguese)</label>
      <textarea id="notesInput" rows="3">${esc(pageData.notes)}</textarea>
      <div class="actions">
        <button class="primary" id="saveButton">Save</button>
        <label class="check"><input type="checkbox" id="finalizedInput" ${s.finalized ? "checked" : ""}> Finalized</label>
        <span class="grow"></span>
        <button id="copyButton">Copy report for Moodle</button>
        <button id="regradeOneButton" ${s.finalized ? "disabled" : ""}>Regrade this student</button>
      </div>
      <details id="previewDetails"><summary>Report preview</summary><pre id="preview"></pre></details>`;
  }
  html += `<details ${ev ? "" : "open"}><summary>Submitted code</summary><pre>${renderCode(pageData.code)}</pre></details>`;
  $("#studentPage").innerHTML = html;
  bindStudentPage();
}

function collectGrades() {
  const grades = {};
  const comments = {};
  document.querySelectorAll(".criterion").forEach(el => {
    const c = pageData.evaluation.criteria[+el.dataset.index];
    let value = parseFloat(String(el.querySelector(".grade-input").value).replace(",", "."));
    grades[c.name] = Math.max(0, Math.min(c.points, isNaN(value) ? 0 : value));
    comments[c.name] = el.querySelector(".comment-input").value;
  });
  return {grades, comments};
}

function updateTotal() {
  if (!pageData.evaluation) return;
  const {grades} = collectGrades();
  $("#totalGrade").textContent = grade(Object.values(grades).reduce((sum, v) => sum + v, 0));
  document.querySelectorAll(".criterion").forEach(el => {
    const c = pageData.evaluation.criteria[+el.dataset.index];
    el.classList.remove("good", "partial", "bad");
    el.classList.add(criterionClass(c, grades[c.name]));
  });
}

async function save() {
  const body = {
    ex: currentExercise, id: currentStudent,
    name: $("#nameInput").value, number: $("#numberInput").value, class: $("#classInput").value,
  };
  if (pageData.evaluation) {
    Object.assign(body, collectGrades());
    body.notes = $("#notesInput").value;
    body.finalized = $("#finalizedInput").checked;
  }
  if ($("#fileSelect")) body.file = $("#fileSelect").value;
  await api("/api/save", body);
  unsaved = false;
  await loadStudents();
}

async function fetchReport() {
  if (unsaved) await save();
  return api(`/api/report?${exParam()}&id=${encodeURIComponent(currentStudent)}`);
}

function bindStudentPage() {
  const page = $("#studentPage");
  page.querySelectorAll("input, textarea, select").forEach(el =>
    el.addEventListener("input", () => { unsaved = true; updateTotal(); }));
  const index = students.findIndex(s => s.id === currentStudent);
  $("#previousButton").onclick = () => openStudent(students[index - 1].id);
  $("#nextButton").onclick = () => openStudent(students[index + 1].id);

  if ($("#saveButton")) {
    $("#saveButton").onclick = async () => {
      try {
        await save();
        toast("Saved.");
        openStudent(currentStudent, true);
      } catch (e) {
        toast(e.message);
      }
    };
    $("#finalizedInput").onchange = async () => {
      try {
        await save();
        toast($("#finalizedInput").checked ? "Marked as finalized." : "No longer finalized.");
        openStudent(currentStudent, true);
      } catch (e) {
        toast(e.message);
      }
    };
    $("#copyButton").onclick = async () => {
      const report = await fetchReport();
      try {
        await navigator.clipboard.writeText(report.text);
        toast("Report copied.");
      } catch (e) {
        $("#preview").textContent = report.text;
        $("#previewDetails").open = true;
        toast("Could not copy. Select the text in the preview.");
      }
    };
    $("#previewDetails").addEventListener("toggle", async () => {
      if ($("#previewDetails").open) $("#preview").textContent = (await fetchReport()).md;
    });
  }
  $("#regradeOneButton").onclick = async () => {
    if (pageData.evaluation
        && !confirm("Regrade this student? Grades and comments go back to the automatic values.")) return;
    try { await save(); } catch (e) {}
    evaluate({ids: [currentStudent], all: true});
  };
}

/* Export */

$("#exportButton").onclick = async () => {
  const graded = students.filter(s => s.evaluated);
  if (!graded.length) return toast("No graded students yet.");
  let ids = graded.map(s => s.id);
  const pending = graded.filter(s => !s.finalized).length;
  const question = `${pending} students are not finalized. Export them too?\n\nCancel exports only the finalized ones.`;
  if (pending && !confirm(question)) ids = graded.filter(s => s.finalized).map(s => s.id);
  if (!ids.length) return toast("No finalized students.");
  const query = `${exParam()}&ids=${ids.map(encodeURIComponent).join(",")}`;
  const response = await fetch("/api/export?" + query);
  if (!response.ok) return toast("Export failed.");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(await response.blob());
  link.download = currentExercise + "_reports.zip";
  link.click();
  const folder = decodeURIComponent(response.headers.get("X-Folder"));
  toast(`${response.headers.get("X-Count")} reports exported. Also saved in ${folder}`);
};

window.addEventListener("beforeunload", event => {
  if (unsaved) {
    event.preventDefault();
    event.returnValue = "";
  }
});

loadExercises().then(loadStudents);
</script>
</body>
</html>
